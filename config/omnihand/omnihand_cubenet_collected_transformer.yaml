# Basic settings
log_dir: 'log/omnihand'
strategy: 'ddp'

# Data configuration with temporal support
data_cfg:
  target: src.data.data_interface.BaseDataInterface
  params:
    cfg: 
      dataset: src.data.dataset.CollectedSingleFrameDataset
      train_split: 'dataset/collected-700/train.json'
      val_split: 'dataset/collected-700/val.json'
      test_split: 'dataset/collected-700/val.json'
      opt: 
        # Enable temporal processing
        use_temporal: true
        num_temporal_frames: 8  # Increased from 5 for better temporal modeling
        norm_pose: true
      num_workers: 4

# Model configuration with Enhanced Transformer-based temporal backbone
model_cfg:
  target: src.model.omnihand.OmniHand
  params:
    cfg:
      use_simulator: false
      learnable_weights: true
      backbone: 
        target: src.model.encoder.cubenet_transformer.CubeNetTransformer
        params: 
          # Spatial encoder parameters (CubeNet)
          in_channels: 64  # mmWave data channels
          base_channels: 64
          stage_channels: [64, 128, 256, 512]  # Match CubeNet implementation
          stage_blocks: [2, 2, 2, 2]  # Match CubeNet implementation
          use_attention: true  # Enable attention mechanisms
          use_pafpn: false  # Enable PAFPN neck
          
          # Enhanced modules (SOTA features)
          use_se_attention: false  # SE attention for channel recalibration
          use_deformable_conv: false  # Deformable convolution for adaptive feature extraction
          # Pretrained spatial encoder settings
          spatial_encoder_pretrained: null  # Path to pretrained CubeNet weights (if available)
          spatial_encoder_freeze: false  # Whether to freeze spatial encoder
          # Enhanced temporal transformer parameters
          temporal_frames: 8  # Must match dataset configuration
          transformer_layers: 8  # Increased layers for better modeling capacity
          transformer_heads: 8  # Attention heads (must divide 512)
          transformer_dim_feedforward: 2048  # Feedforward dimension
          transformer_dropout: 0.1  # Dropout rate in transformer
          # Advanced temporal modeling features
          temporal_kernel_size: 3  # Kernel size for temporal convolutions
          use_cross_attention: true  # Enable cross-attention for spatial-temporal fusion
          # Output parameters
          output_dim: 512  # Output dimension for final features
        pretrained: null
        freeze: false
      regressor:
        target: torch.nn.Linear
        params:
          in_features: 512  # Must match backbone output_dim
          out_features: 144  # 21 joints × 3 coordinates + 21 joints × 3 rotations
      training:
        lr: 8.0e-5  # Slightly reduced learning rate for enhanced model
        betas: [0.9, 0.999]  # Adam optimizer betas
        weight_decay: 0.02  # Increased weight decay for better regularization
        
        # Enhanced training schedule
        warmup_steps: 1000  # Warmup steps for learning rate
        lr_schedule: 'cosine'  # Cosine annealing learning rate schedule
