# Basic settings
log_dir: 'log/omnihand'
strategy: 'ddp'

# Data configuration
data_cfg:
  target: src.data.data_interface.BaseDataInterface
  params:
    cfg: 
      dataset: src.data.dataset.SingleFrameDataset
      train_split: 'dataset/csl-news-demo01/train.json'
      val_split: 'dataset/csl-news-demo01/val.json'
      test_split: 'dataset/csl-news-demo01/val.json'
      opt: 
        load_feature: false
        norm_pose: true
      num_workers: 4

# Model configuration
model_cfg:
  target: src.model.omnihand.OmniHand
  params:
    cfg:
      learnable_weights: true
      backbone: 
        target: src.model.encoder.cubenet.CubeNet
        params: 
          input_dim: 64
          hidden_dims: [64, 128, 256, 512]
          num_blocks: [3, 4, 6, 3]
          strides: [[2, 2, 2], [2, 2, 2], [2, 2, 2], [1, 1, 1]] 
          block: src.model.encoder.cubenet.BasicBlock3D
          norm_layer: torch.nn.GroupNorm
        pretrained: null
        freeze: false
      regressor:
        target: torch.nn.Linear
        params:
          in_features: 512
          out_features: 144
      discriminator:
        pretrained: null
        freeze: false
      training:
        use_discriminator: false
        disc_lr: 1.0e-4
        lambda_gan: 5.0
        gan_start_iter: 0
        lr: 1.0e-4
        betas: [0.9, 0.999]
        weight_decay: 0.01
