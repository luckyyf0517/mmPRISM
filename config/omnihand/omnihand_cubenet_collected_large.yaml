# Basic settings
log_dir: 'log/omnihand'
strategy: 'ddp'

# Data configuration
data_cfg:
  target: src.data.data_interface.BaseDataInterface
  params:
    cfg: 
      dataset: src.data.dataset.CollectedSingleFrameDataset
      train_split: 'dataset/collected-700/train.json'
      val_split: 'dataset/collected-700/val.json'
      test_split: 'dataset/collected-700/val.json'
      opt: 
        norm_pose: true
      num_workers: 4

# Model configuration
model_cfg:
  target: src.model.omnihand.OmniHand
  params:
    cfg:
      use_simulator: false
      learnable_weights: true
      antenna_array_size: "large"  # 32*4 antenna array
      backbone: 
        target: src.model.encoder.cubenet.CubeNet
        params: 
          in_channels: 64
          base_channels: 64
          stage_channels: [64, 128, 256, 512]  
          stage_blocks: [2, 2, 2, 2]  
          use_attention: true  
          use_pafpn: false  
          use_se_attention: true  
        pretrained: null
        freeze: false
      regressor:
        target: torch.nn.Linear
        params:
          in_features: 512  # Match CubeNet feature_dim output
          out_features: 144
      training:
        lr: 1.0e-4
        betas: [0.9, 0.999]
        weight_decay: 0.01