# Basic settings
log_dir: 'log/omnihand'
strategy: 'ddp'

# Data configuration
data_cfg:
  target: src.data.data_interface.BaseDataInterface
  params:
    cfg: 
      dataset: src.data.dataset.CollectedSingleFrameDataset
      train_split: 'dataset/collected-demo/train.json'
      val_split: 'dataset/collected-demo/val.json'
      test_split: 'dataset/collected-demo/val.json'
      opt: 
        norm_pose: true
      num_workers: 4

# Model configuration
model_cfg:
  target: src.model.omnihand.OmniHand
  params:
    cfg:
      use_simulator: false
      learnable_weights: true
      backbone: 
        target: src.model.encoder.cubenet_rtm.CSPEncoder3D
        params: 
          in_channels: 64  # mmWave data channels
          base_channels: 64
          stage_channels: [128, 256, 512, 1024]  # Increased channel progression for better feature extraction
          stage_blocks: [2, 4, 4, 2]  # More blocks for deeper feature learning
          spp_kernel_sizes: [3, 5, 7]
          expansion: 0.5  # Standard expansion ratio
          norm_layer: torch.nn.GroupNorm  # GroupNorm for better regularization
        pretrained: weights/rtm_0824
        freeze: false
      regressor:
        target: torch.nn.Linear
        params:
          in_features: 1024
          out_features: 144
      training:
        lr: 1.0e-4
        betas: [0.9, 0.999]
        weight_decay: 0.01
