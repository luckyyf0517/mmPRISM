# Basic settings
log_dir: "log/peft_finetune"
strategy: "deepspeed"

# Data configuration
data_cfg:
  target: src.data.data_interface.BaseDataInterface
  params:
    cfg:
      dataset: src.data.dataset.CslNewsDataset
      train_split: 'dataset/csl-news-100/train.json'
      val_split: 'dataset/csl-news-100/val.json'
      test_split: 'dataset/csl-news-100/val.json'
      opt: 
        caption_path: "dataset/CSL_News_Labels_converted.json"
        max_length: 512
        mode: "feature"
      num_workers: 4

# Model configuration
model_cfg:
  target: src.model.trainer.WaveLLMTrainer
  params:
    cfg:
      # LLM configuration
      model_type: "phi3"
      conv_type: "role" # "role" or "simple"
      model:
        model_path: "huggingface/Phi-3-mini-4k-instruct"
        model_max_length: 2048
        wave_start_token: "<wave>"
        wave_end_token: "</wave>"
        wave_patch_token: "<wave_patch>"
      
      # PEFT configuration
      use_peft: true
      fix_llm: true
      peft_config:
        r: 8
        lora_alpha: 16
        target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
        lora_dropout: 0.05
        bias: "none"
        do_not_add_lora_model: ["mm_projection_layers"]
      
      # Training configuration
      training:
        max_epochs: 10
        learning_rate: 5.0e-4
        weight_decay: 1.0e-4
        warmup_steps: 100
      