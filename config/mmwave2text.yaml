log_dir: 'log/'
strategy: 'ddp'

data_cfg:
  target: src.data.data_interface.BaseDataInterface
  params:
    cfg: 
      dataset: src.data.dataset.mmWave2TextDataset
      train_split: 'dataset/csl-news-demo01/train.json'
      val_split: 'dataset/csl-news-demo01/val.json'
      test_split: 'dataset/csl-news-demo01/val.json'
      max_length: 384
      doppler_size: 64
      num_channels: 2
      selected_channels: [1, 3]
      num_workers: 4 

model_cfg:
  target: src.model.model.mmWave2Text
  params:
    cfg:
      signal_encoder:
        target: src.model.encoder.TemporalImageEncoder
        params:
          resnet_version: 'resnet50'
          pretrained: null
          input_channels: 2
          output_channels: 768
          dropout: 0.1
      model_path: 'microsoft/phi-2'
      label_smoothing: 0.1
      learning_rate: 3.0e-4
      max_epochs: 50