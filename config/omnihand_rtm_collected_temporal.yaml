# Basic settings
log_dir: 'log/omnihand'
strategy: 'ddp'

# Data configuration with temporal support
data_cfg:
  target: src.data.data_interface.BaseDataInterface
  params:
    cfg: 
      dataset: src.data.dataset.CollectedSingleFrameDataset
      train_split: 'dataset/collected-700/train.json'
      val_split: 'dataset/collected-700/val.json'
      test_split: 'dataset/collected-700/val.json'
      opt: 
        # Enable temporal processing
        use_temporal: true
        num_temporal_frames: 5  # Process 5 consecutive frames
        norm_pose: true
      num_workers: 4

# Model configuration with temporal backbone
model_cfg:
  target: src.model.omnihand.OmniHand
  params:
    cfg:
      use_simulator: false
      learnable_weights: true
      backbone: 
        target: src.model.encoder.cubenet_rtm_temporal.CSPRTMTemporalEncoder3D
        params: 
          in_channels: 64  # mmWave data channels
          base_channels: 64
          stage_channels: [128, 256, 512, 1024]  # Increased channel progression for better feature extraction
          stage_blocks: [2, 4, 4, 2]  # More blocks for deeper feature learning
          spp_kernel_sizes: [3, 5, 7]
          expansion: 0.5  # Standard expansion ratio
          norm_layer: torch.nn.GroupNorm  # GroupNorm for better regularization
          temporal_frames: 5  # Must match dataset configuration
          num_velocity_heads: 8  # Number of attention heads for Doppler processing
          spatial_encoder_pretrained: weights/rtm_0824/model.pth  # Path to pretrained CSPEncoder3D weights (optional)
          spatial_encoder_freeze: true  # Freeze spatial encoder parameters (useful with pretrained weights)
        pretrained: null
        freeze: false
      regressor:
        target: torch.nn.Linear
        params:
          in_features: 256  # Updated to match new backbone feature dimension
          out_features: 144
      discriminator:
        pretrained: null
        freeze: false
      training:
        use_discriminator: false
        disc_lr: 1.0e-4
        gan_start_iter: 1000
        lambda_gp: 0.0
        lambda_gan: 0.1
        lr: 1.0e-4
        betas: [0.9, 0.999]
        weight_decay: 0.01