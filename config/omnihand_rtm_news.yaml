# Basic settings
log_dir: 'log/omnihand'
strategy: 'ddp'

# Data configuration
data_cfg:
  target: src.data.data_interface.BaseDataInterface
  params:
    cfg: 
      dataset: src.data.dataset.SingleFrameDataset
      train_split: 'dataset/csl-news-200/train.json'
      val_split: 'dataset/csl-news-200/val.json'
      test_split: 'dataset/csl-news-200/val.json'
      opt: 
        load_feature: false
        norm_pose: true
      num_workers: 4

# Model configuration
model_cfg:
  target: src.model.omnihand.OmniHand
  params:
    cfg:
      learnable_weights: true
      backbone: 
        target: src.model.encoder.cubenet_rtm.RTMEncoder3D
        params: 
          in_channels: 32  # mmWave data channels
          base_channels: 64
          stage_channels: [128, 256, 512, 1024]  # Increased channel progression for better feature extraction
          stage_blocks: [3, 6, 6, 3]  # More blocks for deeper feature learning
          expansion: 0.5  # Standard expansion ratio
          channel_attention: true  # Enable channel attention for better feature refinement
          norm_layer: torch.nn.GroupNorm  # GroupNorm for better regularization
        pretrained: null  
        freeze: false
      regressor:
        target: src.model.encoder.cubenet_rtm.PoseDecoderSimCC3D
        params:
          input_feature_dim: 1024  # Should match backbone's feature_dim
          output_kpts: 48  # 24 keypoints per hand * 2 hands
          input_spatial_dims: [32, 32, 32]  # [D, H, W] of input mmWave volume
          simcc_split_ratio: [2.0, 16.0, 16.0]
          shared_mlp_hidden_dim: 512
          dropout_rate: 0.1
      discriminator:
        pretrained: null
        freeze: false
      training:
        use_discriminator: false
        disc_lr: 1.0e-4
        lambda_gan: 5.0
        gan_start_iter: 0
        lr: 1.0e-4
        betas: [0.9, 0.999]
        weight_decay: 0.01
