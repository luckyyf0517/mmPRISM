schema_version: mmprism.omnihand_run.v1

model:
  spatial:
    in_channels: 8
    stem_channels: 16
    stage_channels: [16, 32, 64]
    stage_depths: [1, 1, 1]
    channel_attention: true
    spatial_attention: true
    se_attention: true
    use_pafpn: true
    fpn_channels: 64
  temporal:
    max_frames: 10
    layers: 8
    heads: 16
    feedforward_dim: 256
    dropout: 0.0
  joint_count: 24
  coordinate_dim: 3

data:
  batch_size: 2
  num_workers: 0
  verify_checksums: true
  shuffle: true

optimization:
  epochs: 2
  max_steps: 2
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  beta1: 0.9
  beta2: 0.98
  gradient_clip_norm: 1.0

evaluation:
  pck_threshold_mm: 40.0
  save_targets: true
