# Basic settings
log_dir: 'log/omnihand'
strategy: 'ddp'

# Data configuration
data_cfg:
  target: src.data.data_interface.BaseDataInterface
  params:
    cfg: 
      dataset: src.data.dataset.CollectedSingleFrameDataset
      train_split: 'dataset/collected-demo/train.json'
      val_split: 'dataset/collected-demo/val.json'
      test_split: 'dataset/collected-demo/val.json'
      opt: 
        norm_pose: true
      num_workers: 4

# Model configuration
model_cfg:
  target: src.model.omnihand.OmniHand
  params:
    cfg:
      use_simulator: false
      learnable_weights: false
      backbone: 
        target: src.model.encoder.mmhand.MMHandEncoder
        params: 
          input_dim: 64
          hidden_dims: [64, 128, 256, 512]
          num_blocks: [2, 2, 2, 2]
          reduction_ratio: 16
        pretrained: null
        freeze: false
      regressor:
        target: torch.nn.Linear
        params:
          in_features: 512 
          out_features: 144
      training:
        lr: 1.0e-4
        betas: [0.9, 0.999]
        weight_decay: 0.01
